<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7fb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="简单好用的住宿登记，信息仅保存在当前设备。">
  <title>住宿登记</title>
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="stylesheet" href="./styles.css?v=arrivals-8">
  <script src="./storage.js?v=arrivals-8" defer></script>
  <script src="./arrivals.js?v=arrivals-8" defer></script>
  <script src="./motion.js?v=arrivals-8" defer></script>
  <script src="./app.js?v=arrivals-8" defer></script>
</head>
<body>
  <svg class="symbol-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="i-bed" viewBox="0 0 24 24"><path d="M3 18v-7m18 7v-7M3 14h18M5 10V6a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v4M3 14v-3a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v3M8 7.5h2m4 0h2"/></symbol>
    <symbol id="i-backup" viewBox="0 0 24 24"><path d="M5 8H3V3m0 5a9 9 0 1 1-1 7M12 7v5l3 2"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M19 10c0 5-7 10-7 10S5 15 5 10a7 7 0 0 1 14 0Z"/><circle cx="12" cy="10" r="2"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="m7 3 3 5-3 2a14 14 0 0 0 7 7l2-3 5 3-1 3c-.5 1.5-3 1.2-4 1C9 19 5 15 3 8c-.3-1-.5-3.5 1-4l3-1Z"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="7" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M16 4a3 3 0 0 1 0 6m3 11v-3a6 6 0 0 0-3-5"/></symbol>
    <symbol id="i-meal" viewBox="0 0 24 24"><path d="M5 3v7m3-7v7m-6-7v7a3 3 0 0 0 6 0M5 13v8M18 3c-4 2-4 8 0 9h2V3h-2Zm2 9v9"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><rect x="5" y="3" width="15" height="18" rx="2"/><path d="M9 3v18M3 7h4m-4 5h4m-4 5h4m6-9h4m-4 4h4"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 11h18m-13 4h2m4 0h2"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="13" height="13" rx="3"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></symbol>
    <symbol id="i-import" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></symbol>
    <symbol id="i-company" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7h1m4 0h1m-6 4h1m4 0h1m-5 10v-5h4v5M3 21h18"/></symbol>
  </defs></svg>

  <div id="home-view" class="app-shell">
    <header class="topbar">
      <div class="app-brand"><span class="app-icon"><svg class="icon"><use href="#i-bed"/></svg></span><span>住宿登记</span></div>
      <div class="top-actions"><span class="local-badge"><svg class="icon" aria-hidden="true"><use href="#i-lock"/></svg>本机保存</span><button id="open-backup" class="backup-button" type="button" aria-label="备份与恢复"><svg class="icon" aria-hidden="true"><use href="#i-backup"/></svg><span>备份</span></button></div>
    </header>
    <main id="main-content" class="content">
      <div class="page-heading"><p id="today-label" class="date-label" hidden></p><h1 id="home-title">旅居公司</h1><p class="hierarchy-caption">选一家旅居公司，登记和查看住客。</p></div>
      <section id="arrival-reminders" class="arrival-reminders" aria-labelledby="arrival-title" hidden>
        <div class="arrival-heading"><h2 id="arrival-title"><svg class="icon" aria-hidden="true"><use href="#i-calendar"/></svg>入住提醒</h2><span id="arrival-date" class="arrival-date"></span></div>
        <div class="arrival-switch" role="group" aria-label="查看入住提醒">
          <button type="button" data-arrival-view="arrivals" class="active" aria-pressed="true" aria-controls="arrival-list">近期入住<span id="arrival-count">0</span></button>
          <button type="button" data-arrival-view="staying" aria-pressed="false" aria-controls="arrival-list">入住中<span id="staying-count">0</span></button>
        </div>
        <p id="arrival-summary" class="arrival-summary" role="status" aria-live="polite"></p>
        <div id="arrival-list" class="arrival-list"></div>
        <button id="arrival-expand" class="arrival-expand" type="button" aria-expanded="false" aria-controls="arrival-list" hidden></button>
        <p class="arrival-note">按登记日期自动更新，提前 3 天提醒</p>
      </section>
      <div id="company-module">
        <div class="search-box"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg><input id="company-search" type="search" aria-label="搜索旅居公司" placeholder="搜索公司或联系人" autocomplete="off" enterkeyhint="search"><button id="clear-company-search" class="clear-search" type="button" aria-label="清空公司搜索" hidden><svg class="icon"><use href="#i-close"/></svg></button></div>
        <div class="list-heading"><h2>公司列表</h2><span id="company-count">0 家公司</span></div>
        <section id="company-list" class="company-list" aria-label="旅居公司列表" aria-live="polite"></section>
      </div>
    </main>
    <footer class="home-toolbar"><button id="add-company" class="primary-button add-button" type="button"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg><span>新增旅居公司</span></button></footer>
  </div>

  <section id="company-overlay" class="page-view" data-presentation="push" data-state="closed" role="dialog" aria-modal="true" aria-labelledby="company-title" hidden>
    <div class="view-dimmer" aria-hidden="true"></div>
    <div class="page-panel company-page">
      <header class="view-nav"><button class="text-button back-button" type="button" data-close="company-overlay"><svg class="icon" aria-hidden="true"><use href="#i-back"/></svg>公司</button><h2 id="company-title" tabindex="-1">公司客人</h2><button id="edit-company" class="text-button sheet-done" type="button">编辑</button></header>
      <div class="view-scroll company-content">
        <div class="company-profile"><div class="company-profile-row"><span id="company-detail-symbol" class="company-symbol" aria-hidden="true"></span><div class="company-profile-copy"><h3 id="company-name"></h3><p id="company-contact" class="company-contact"></p></div></div><p id="company-notes" class="company-notes" hidden></p></div>
        <div class="guest-tools"><div class="search-box"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg><input id="company-guest-search" type="search" aria-label="搜索公司客人" placeholder="搜索住客、电话或订单" autocomplete="off" enterkeyhint="search"><button id="clear-company-guest-search" class="clear-search" type="button" aria-label="清空客人搜索" hidden><svg class="icon"><use href="#i-close"/></svg></button></div>
        <div class="filters" role="group" aria-label="筛选公司客人入住状态"><span id="company-filter-selection" class="filter-selection" aria-hidden="true"></span><button class="filter active" data-company-filter="all" aria-pressed="true" type="button">全部</button><button class="filter" data-company-filter="upcoming" aria-pressed="false" type="button">待入住</button><button class="filter" data-company-filter="staying" aria-pressed="false" type="button">入住中</button><button class="filter" data-company-filter="finished" aria-pressed="false" type="button">已结束</button></div></div>
        <div class="list-heading"><h3 id="company-list-title">客人入住</h3><span id="company-guest-count">0 条记录</span></div>
        <section id="company-guest-list" class="order-list" aria-live="polite" aria-labelledby="company-list-title"></section>
      </div>
      <footer class="company-toolbar"><button id="add-company-guest" class="primary-button" type="button"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>新增客人入住</button></footer>
    </div>
  </section>

  <section id="company-form-overlay" class="page-view" data-presentation="sheet" data-state="closed" role="dialog" aria-modal="true" aria-labelledby="company-form-title" hidden>
    <div class="view-dimmer" aria-hidden="true"></div>
    <div class="page-panel company-form-panel">
      <div class="sheet-grabber" aria-hidden="true"><span></span></div>
      <header class="view-nav"><button class="text-button" type="button" data-close="company-form-overlay">取消</button><h2 id="company-form-title" tabindex="-1">登记旅居公司</h2><span aria-hidden="true"></span></header>
      <div class="view-scroll">
        <form id="company-form" novalidate>
          <fieldset><legend>公司档案</legend><div class="field-group">
            <label class="field"><span>公司名称 <b>*</b></span><input name="name" required maxlength="80" placeholder="填写旅居公司名称" autocomplete="off" enterkeyhint="next"></label>
          </div><p class="field-note">每家旅居公司单独管理住客。保存后进入该公司的住客列表。</p></fieldset>
          <fieldset><legend>联系信息 <span class="optional">选填</span></legend><div class="field-group">
            <label class="field"><span>联系人</span><input name="contact" maxlength="30" placeholder="公司联系人" autocomplete="off" enterkeyhint="next"></label>
            <label class="field"><span>联系电话</span><input name="phone" type="tel" inputmode="tel" pattern="[0-9+\-\s]{6,20}" maxlength="20" placeholder="公司联系电话" autocomplete="off" enterkeyhint="next"></label>
          </div></fieldset>
          <fieldset><legend>备注 <span class="optional">选填</span></legend><div class="field-group fee-group"><textarea name="notes" rows="3" maxlength="200" aria-label="公司备注" placeholder="补充公司的合作或接待说明"></textarea></div></fieldset>
          <p id="company-form-error" class="form-error" role="alert" hidden></p>
          <button id="delete-company" class="delete-button" type="button" hidden>删除公司档案</button>
          <div class="form-actions"><button id="save-company" class="primary-button" type="submit"><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg><span>保存公司</span></button></div>
        </form>
      </div>
    </div>
  </section>

  <section id="form-overlay" class="page-view" data-presentation="push" data-state="closed" role="dialog" aria-modal="true" aria-labelledby="form-title" hidden>
    <div class="view-dimmer" aria-hidden="true"></div>
    <div class="page-panel">
      <header class="view-nav"><button class="text-button back-button" type="button" data-close="form-overlay"><svg class="icon" aria-hidden="true"><use href="#i-back"/></svg>返回</button><h2 id="form-title" tabindex="-1">新增登记</h2><span class="nav-spacer" aria-hidden="true"></span></header>
      <div class="view-scroll">
        <div class="membership"><span class="membership-label">旅居公司</span><strong id="order-company-name"></strong><span id="legacy-company-choice" class="select-wrap" hidden><select id="order-company" aria-label="将历史住客归入旅居公司"></select><svg class="icon" aria-hidden="true"><use href="#i-chevron"/></svg></span></div>
        <form id="order-form" novalidate>
          <fieldset><legend>订单信息</legend><div class="field-group">
            <label class="field"><span>旅店/订单 <b>*</b></span><input name="hotelOrder" required maxlength="80" placeholder="旅店或订单名称" autocomplete="off" enterkeyhint="next"></label>
            <label class="field"><span>入住基地 <b>*</b></span><input name="base" required maxlength="40" placeholder="基地名称" autocomplete="off" enterkeyhint="next"></label>
          </div></fieldset>
          <fieldset><legend>客户信息</legend><div class="field-group">
            <label class="field"><span>客户姓名 <b>*</b></span><input name="customerName" required maxlength="30" placeholder="客人姓名" autocomplete="off" enterkeyhint="next"></label>
            <label class="field"><span>客户电话 <b>*</b></span><input name="phone" type="tel" inputmode="tel" required pattern="[0-9+\-\s]{6,20}" maxlength="20" placeholder="联系电话" autocomplete="off" enterkeyhint="next"></label>
          </div></fieldset>
          <fieldset><legend>入住安排</legend><div class="field-group">
            <label class="field date-field"><span>入住时间 <b>*</b></span><input name="arrivalDate" type="date" required aria-label="入住时间"></label>
            <div class="field"><label for="nights">入住天数 <b>*</b></label><div class="stepper"><button type="button" data-step="-1" aria-label="减少一晚">−</button><input id="nights" name="nights" type="number" inputmode="numeric" min="1" step="1" required value="1" aria-label="入住天数"><span class="unit">晚</span><button type="button" data-step="1" aria-label="增加一晚">＋</button></div></div>
            <label class="field"><span>入住人数 <b>*</b></span><input name="guestCount" required maxlength="20" placeholder="如：2大1小" autocomplete="off" enterkeyhint="next"></label>
            <label class="field"><span>入住房型 <b>*</b></span><input name="roomType" required maxlength="30" placeholder="如：亲子房" autocomplete="off" enterkeyhint="next"></label>
            <label class="field"><span>是否含餐</span><span class="select-wrap"><select name="mealIncluded"><option value="否">不含餐</option><option value="是">含餐</option></select><svg class="icon" aria-hidden="true"><use href="#i-chevron"/></svg></span></label>
          </div></fieldset>
          <fieldset><legend>费用明细 <span class="optional">选填</span></legend><div class="field-group fee-group"><textarea name="feeDetails" rows="3" maxlength="200" aria-label="费用明细" placeholder="房费、餐费或其他费用说明"></textarea><div class="textarea-footer"><span>最多 200 字</span><span id="fee-count">0 / 200</span></div></div></fieldset>
          <p id="form-error" class="form-error" role="alert" hidden></p>
          <button id="delete-order" class="delete-button" type="button" hidden>删除这条登记</button>
          <div class="form-actions"><button id="save-order" class="primary-button" type="submit"><svg class="icon"><use href="#i-check"/></svg><span>保存登记</span></button></div>
        </form>
      </div>
    </div>
  </section>

  <section id="backup-overlay" class="page-view" data-presentation="sheet" data-state="closed" role="dialog" aria-modal="true" aria-labelledby="backup-title" hidden>
    <div class="view-dimmer" aria-hidden="true"></div>
    <div class="page-panel backup-panel">
      <div class="sheet-grabber" aria-hidden="true"><span></span></div>
      <header class="view-nav"><span class="nav-spacer" aria-hidden="true"></span><h2 id="backup-title" tabindex="-1">备份与恢复</h2><button class="text-button sheet-done" type="button" data-close="backup-overlay">完成</button></header>
      <div class="view-scroll backup-content">
        <div class="backup-intro"><span class="backup-emblem"><svg class="icon" aria-hidden="true"><use href="#i-backup"/></svg></span><h3>备份你的入住记录</h3><p>复制后粘贴到备忘录保存，<br>换设备时也能合并恢复。</p></div>
        <button id="copy-backup" class="backup-export" type="button"><span class="action-icon"><svg class="icon"><use href="#i-copy"/></svg></span><span class="action-copy"><strong>复制本机备份</strong><span id="backup-count">备份全部登记信息</span></span><svg class="icon chevron"><use href="#i-chevron"/></svg></button>
        <div class="import-section"><label for="backup-data">恢复已有备份</label><p>粘贴备份内容，合并到本机记录。</p><textarea id="backup-data" class="backup-data" rows="4" spellcheck="false" placeholder="在这里粘贴备份内容"></textarea><button id="import-backup" class="primary-button" type="button"><svg class="icon"><use href="#i-import"/></svg>合并导入</button><p class="import-note">相同编号以备份内容为准。</p></div>
        <p class="device-note"><svg class="icon"><use href="#i-lock"/></svg>备份与导入均在本机完成</p>
      </div>
    </div>
  </section>
  <dialog id="confirm-dialog" class="confirm-dialog" role="dialog" aria-labelledby="confirm-title" aria-describedby="confirm-description">
    <div class="confirm-copy"><h2 id="confirm-title"></h2><p id="confirm-description"></p></div>
    <div class="confirm-actions"><button id="confirm-cancel" type="button" autofocus>取消</button><button id="confirm-accept" type="button"></button></div>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"><svg class="icon"><use href="#i-check"/></svg><span id="toast-message"></span></div>
</body>
</html>
